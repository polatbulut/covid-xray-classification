# ResNet-50 with light geometric and photometric augmentation.
#
# Note on random_horizontal_flip: mirroring a chest radiograph moves the cardiac
# silhouette to the right-hand side, which is anatomically abnormal (dextrocardia
# or situs inversus). It is kept here because it is what the recorded runs used,
# but it is worth ablating before drawing conclusions from this configuration.
data:
  train_dir: data/processed/train
  val_dir: data/processed/val
  test_dir: data/processed/test
  img_size: [224, 224]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  augment:
    random_horizontal_flip: true
    random_rotation: 15
    brightness_jitter: 0.2
    contrast_jitter: 0.2

model:
  name: resnet50
  pretrained: true

training:
  epochs: 30
  batch_size: 16
  num_workers: 4
  lr: 0.00005
  weight_decay: 0.0001
  patience: 5
  monitor: val_f1
  class_weighting: inverse
  seed: 42
  checkpoint_path: models/resnet50_augmented.pth
