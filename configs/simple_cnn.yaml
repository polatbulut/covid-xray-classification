# Baseline: a small CNN trained from scratch. Fast, and a useful lower bound
# for judging whether transfer learning is actually earning its keep.
data:
  train_dir: data/processed/train
  val_dir: data/processed/val
  test_dir: data/processed/test
  img_size: [224, 224]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

model:
  name: simple
  pretrained: false

training:
  epochs: 20
  batch_size: 32
  num_workers: 4
  lr: 0.0001
  weight_decay: 0.0001
  patience: 3
  monitor: val_f1
  class_weighting: inverse
  seed: 42
  checkpoint_path: models/simple_cnn.pth
