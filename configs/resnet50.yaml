# ResNet-50 transfer learning without augmentation.
data:
  train_dir: data/processed/train
  val_dir: data/processed/val
  test_dir: data/processed/test
  img_size: [224, 224]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

model:
  name: resnet50
  pretrained: true

training:
  epochs: 25
  batch_size: 16
  num_workers: 4
  lr: 0.00005
  weight_decay: 0.0001
  patience: 4
  monitor: val_f1
  class_weighting: inverse
  seed: 42
  checkpoint_path: models/resnet50.pth
