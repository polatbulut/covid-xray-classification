[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "covid-xray-classification"
description = "Chest X-ray classification into COVID-19, lung opacity, normal and viral pneumonia with PyTorch."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "polatbulut" }]
keywords = ["deep-learning", "pytorch", "medical-imaging", "image-classification", "chest-xray"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "pillow>=10.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
data = ["kaggle>=1.6"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-PyYAML",
    "types-tqdm",
]

[project.scripts]
covid-xray = "covid_xray.cli:main"

[tool.setuptools.dynamic]
version = { attr = "covid_xray.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["covid_xray*"]

[tool.setuptools.package-data]
covid_xray = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "ANN", # flake8-annotations
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PTH", # flake8-use-pathlib
    "RET", # flake8-return
    "RUF", # ruff-specific
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "ANN401", # dynamically typed *args/**kwargs are unavoidable around torch state dicts
    "D107",   # __init__ is documented on the class docstring
    "D417",   # argument descriptions are optional for short helpers
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["covid_xray"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
pretty = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["timm.*", "torchvision.*", "sklearn.*", "matplotlib.*", "PIL.*", "tqdm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = ["slow: tests that build large pretrained backbones or touch the network"]

[tool.coverage.run]
source = ["covid_xray"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
