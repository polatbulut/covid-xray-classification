data:
  img_size: [300, 300] # 300x300 for EfficientNet-B3
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]
  train_dir: data/processed/train
  val_dir:   data/processed/val
  test_dir:  data/processed/test

  augment:
    random_horizontal_flip: true
    random_rotation: 20
    brightness_jitter: 0.2
    contrast_jitter: 0.2


model:
  type: efficientnet_b3
  
training:
  batch_size: 8
  num_workers: 4
  lr: 0.00003
  weight_decay: 0.0001
  epochs: 30
  patience: 5
  pct_start: 0.1
  anneal_strategy: cos
  checkpoint_path: models/effnetb3.pth
