data:
  img_size: [224, 224]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  train_dir: data/processed/train
  val_dir:   data/processed/val
  test_dir:  data/processed/test

model:
  type: resnet50

training:
  batch_size: 16
  num_workers: 4
  lr: 5e-5
  epochs: 25
  patience: 4
  checkpoint_path: models/resnet50.pth