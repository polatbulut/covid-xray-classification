data:
  img_size: [224, 224]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  train_dir: data/processed/train
  val_dir:   data/processed/val
  test_dir:  data/processed/test

  augment:
    random_horizontal_flip: true
    random_rotation: 15
    brightness_jitter: 0.2
    contrast_jitter: 0.2

model:
  type: resnet50

training:
  batch_size: 16
  num_workers: 4
  lr: 0.00005
  epochs: 30
  patience: 5
  checkpoint_path: models/resnet50_aug.pth
