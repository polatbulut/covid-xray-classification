data:
  img_size: [224, 224]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  train_dir: data/processed/train
  val_dir: data/processed/val
  test_dir: data/processed/test

model:
  type: resnet50

training:
  batch_size: 32
  num_workers: 4
  lr: 1e-4
  epochs: 20
  patience: 3
  checkpoint_path: models/best_model.pth